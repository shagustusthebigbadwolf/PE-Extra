name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      # Library versions pinned to match PE Extra 0.2.8 (mid-2022).
      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp > nul
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.4.0 --quiet
          haxelib install hxCodec 2.5.1 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex --quiet
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib list
        shell: cmd

      - name: Compile
        run: haxelib run lime build windows
        shell: cmd

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shagustus-Engine-Windows
          path: export/release/windows/bin
